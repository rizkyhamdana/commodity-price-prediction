name: Daily Weather Data Sync

on:
  schedule:
    # 22:00 WIB = 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Historical Weather Scraper
        run: |
          python generate_historical_weather.py

      - name: Commit and Push Database Update
        run: |
          git config --local user.email "rizky.hamdana@gmail.com"
          git config --local user.name "rizkyhamdana"
          git add data/exogenous_history_database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update daily weather database [skip ci]" && git push)
