name: Auto Update Commodity Data

on:
  schedule:
    # Berjalan otomatis setiap hari pada pukul 17:00 UTC (00:00 WIB)
    - cron: '0 17 * * *'
  workflow_dispatch:
    # Memungkinkan pemicuan (trigger) workflow secara manual melalui UI GitHub

permissions:
  contents: write

jobs:
  update-commodity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run update script
        run: |
          python update_data.py

      - name: Commit and push if data updated
        run: |
          git config --local user.email "rizky.hamdana@gmail.com"
          git config --local user.name "rizkyhamdana"
          git add commodity_history.json
          
          # Cek apakah ada perubahan pada berkas commodity_history.json
          if git diff --cached --quiet; then
            echo "✅ Tidak ada perubahan data baru untuk di-commit."
          else
            git commit -m "chore(data): auto-update commodity_history.json [skip ci]"
            git push
          fi
