name: Daily Exchange Rate Sync

on:
  schedule:
    # 17:00 WIB = 10:00 UTC (Sesuai jam tutup bursa valas/saham harian)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  update-exchange:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Historical Exchange Scraper
        run: |
          python generate_historical_exchange.py

      - name: Commit and Push Database Update
        run: |
          git config --local user.email "rizky.hamdana@gmail.com"
          git config --local user.name "rizkyhamdana"
          git add data/exchange_rate_database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update daily exchange rate database [skip ci]" && git push)
